stages:
  - validate
  - build
  - security

default:
  image: node:22
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.30.3 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile=false --network-concurrency=1 --child-concurrency=1
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .pnpm-store/
      - node_modules/
      - apps/web/node_modules/
      - apps/api/node_modules/
      - apps/mobile/node_modules/
    policy: pull-push

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  EXPO_NO_TELEMETRY: "1"

lint:
  stage: validate
  script:
    - pnpm -r lint

typecheck:
  stage: validate
  script:
    - pnpm -r typecheck

plugin_woocommerce_tests:
  stage: validate
  image: composer:2
  before_script:
    - cd apps/plugin/woocommerce
    - composer install --prefer-dist --no-interaction --no-progress
  cache:
    key:
      files:
        - apps/plugin/woocommerce/composer.lock
      prefix: plugin-woocommerce-composer
    paths:
      - .composer-cache/
      - apps/plugin/woocommerce/vendor/
    policy: pull-push
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - composer lint
    - mkdir -p build/phpunit
    - vendor/bin/phpunit --configuration phpunit.xml.dist --log-junit build/phpunit/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/plugin/woocommerce/build/phpunit/junit.xml

test_api:
  stage: validate
  script:
    - pnpm --filter api test:ci

build_web:
  stage: build
  script:
    - pnpm --filter web build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/web/.next/

build_api:
  stage: build
  script:
    - pnpm --filter api build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/api/dist

mobile_check:
  stage: build
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.30.3 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --filter gomileapp... --frozen-lockfile=false --network-concurrency=1 --child-concurrency=1
  script:
    - EXPO_NO_TELEMETRY=1 pnpm --filter gomileapp lint
    - pnpm --filter gomileapp typecheck

audit:
  stage: security
  script:
    - pnpm audit --prod || true
  allow_failure: true
