stages:
  - validate
  - build
  - security

default:
  image: node:22
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.30.3 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile=false --network-concurrency=1 --child-concurrency=1
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .pnpm-store/
      - node_modules/
      - apps/web/node_modules/
      - apps/api/node_modules/
      - apps/mobile/node_modules/
    policy: pull-push

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  EXPO_NO_TELEMETRY: "1"

linttsx_web:
  stage: validate
  tags:
    - docker
  image: node:22-alpine
  script:
    - pnpm --filter web lint:tsx

lintcss_web:
  stage: validate
  tags:
    - docker
  image: node:22-alpine
  script:
    - pnpm --filter web lint:css

typecheck_web:
  stage: validate
  tags:
    - docker
  image: node:22-alpine
  script:
    - pnpm --filter web typecheck

cypress_web_tests:
  stage: validate
  tags:
    - docker
  image: cypress/base:22.15.0
  variables:
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.30.3 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile=false --network-concurrency=1 --child-concurrency=1
    - pnpm --filter web exec cypress install
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .pnpm-store/
      - node_modules/
      - apps/web/node_modules/
      - .cache/Cypress/
    policy: pull-push
  script:
    - pnpm --filter web build
    - pnpm --filter web start > web.log 2>&1 &
    - SERVER_PID=$!
    - sleep 15
    - pnpm --filter web cypress:run
    - kill $SERVER_PID || true
  after_script:
    - cat web.log || true
    - pkill -f "next start" || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - web.log
      - apps/web/cypress/screenshots/
      - apps/web/cypress/videos/

plugin_woocommerce_tests:
  stage: validate
  image: composer:2
  before_script:
    - cd apps/plugin/woocommerce
    - composer install --prefer-dist --no-interaction --no-progress
  cache:
    key:
      files:
        - apps/plugin/woocommerce/composer.lock
      prefix: plugin-woocommerce-composer
    paths:
      - .composer-cache/
      - apps/plugin/woocommerce/vendor/
    policy: pull-push
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - composer lint
    - mkdir -p build/phpunit
    - vendor/bin/phpunit --configuration phpunit.xml.dist --log-junit build/phpunit/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/plugin/woocommerce/build/phpunit/junit.xml

test_api:
  stage: validate
  script:
    - pnpm --filter api exec prisma generate
    - pnpm --filter api test:ci

build_web:
  stage: build
  script:
    - pnpm --filter web build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/web/.next/

build_api:
  stage: build
  script:
    - pnpm --filter api build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/api/dist

mobile_check:
  stage: build
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.30.3 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --filter gomileapp... --frozen-lockfile=false --network-concurrency=1 --child-concurrency=1
  script:
    - EXPO_NO_TELEMETRY=1 pnpm --filter gomileapp lint
    - pnpm --filter gomileapp typecheck

audit:
  stage: security
  script:
    - pnpm audit --prod || true
  allow_failure: true