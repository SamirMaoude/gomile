# gomile.delivery — web app (Next.js on :3001)
server {
    listen 80;
    listen [::]:80;
    server_name gomile.delivery www.gomile.delivery;

    # Redirect www → apex
    if ($host = www.gomile.delivery) {
        return 301 https://gomile.delivery$request_uri;
    }

    # Certbot will replace this block with an HTTPS redirect after: certbot --nginx
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Next.js static assets — allow browser caching
        location ~* ^/_next/static/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

# api.gomile.delivery — NestJS backend on :4000 (used by mobile app)
server {
    listen 80;
    listen [::]:80;
    server_name api.gomile.delivery;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
